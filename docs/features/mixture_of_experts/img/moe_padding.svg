<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" style="max-width: 720px;">
  <defs>
    <style>
      .section-title { font: bold 17px sans-serif; fill: #333; text-anchor: middle; }
      .grid-title { font: bold 14px sans-serif; fill: #333; text-anchor: middle; }
      .small-label { font: 13px sans-serif; fill: #555; text-anchor: middle; }
      .tiny-label { font: 12px sans-serif; fill: #777; text-anchor: middle; }
      .row-label-l { font: 13px sans-serif; fill: #333; text-anchor: end; }
      .row-label-r { font: 13px sans-serif; fill: #333; text-anchor: start; }
      .mono { font: 12px monospace; fill: #333; text-anchor: middle; }
      .expert-e0 { fill: #e3f2fd; stroke: #1976d2; stroke-width: 1.5; }
      .expert-e1 { fill: #e8f5e9; stroke: #388e3c; stroke-width: 1.5; }
      .expert-e2 { fill: #fff3e0; stroke: #f57c00; stroke-width: 1.5; }
      .pad { fill: #f5f5f5; stroke: #bdbdbd; stroke-width: 1.4; stroke-dasharray: 4 3; }
      .arrow { stroke: #424242; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#424242"/>
    </marker>
  </defs>

  <text x="360" y="28" class="section-title">Fused padding to expert-aligned blocks</text>

  <!-- Left: ragged permuted blocks -->
  <text x="186" y="68" class="grid-title">permuted</text>
  <text x="132" y="113" class="row-label-l">expert 0</text>
  <rect x="140" y="80"  width="92" height="26" class="expert-e0"/>
  <rect x="140" y="106" width="92" height="26" class="expert-e0"/>
  <rect x="140" y="132" width="92" height="26" class="expert-e0"/>
  <text x="132" y="175" class="row-label-l">expert 1</text>
  <rect x="140" y="158" width="92" height="26" class="expert-e1"/>
  <text x="132" y="214" class="row-label-l">expert 2</text>
  <rect x="140" y="184" width="92" height="26" class="expert-e2"/>
  <rect x="140" y="210" width="92" height="26" class="expert-e2"/>
  <text x="186" y="256" class="mono">tokens_per_expert = [3, 1, 2]</text>

  <!-- Arrow -->
  <path d="M 240 162 L 462 162" class="arrow"/>
  <text x="351" y="142" class="tiny-label">token dispatch</text>
  <text x="351" y="156" class="tiny-label">align_size = 2</text>

  <!-- Right: padded blocks -->
  <text x="516" y="52" class="grid-title">padded</text>
  <text x="570" y="113" class="row-label-r">expert 0</text>
  <rect x="470" y="64"  width="92" height="26" class="expert-e0"/>
  <rect x="470" y="90"  width="92" height="26" class="expert-e0"/>
  <rect x="470" y="116" width="92" height="26" class="expert-e0"/>
  <rect x="470" y="142" width="92" height="26" class="pad"/><text x="516" y="159" class="tiny-label">pad</text>
  <text x="570" y="197" class="row-label-r">expert 1</text>
  <rect x="470" y="168" width="92" height="26" class="expert-e1"/>
  <rect x="470" y="194" width="92" height="26" class="pad"/><text x="516" y="211" class="tiny-label">pad</text>
  <text x="570" y="249" class="row-label-r">expert 2</text>
  <rect x="470" y="220" width="92" height="26" class="expert-e2"/>
  <rect x="470" y="246" width="92" height="26" class="expert-e2"/>
  <text x="516" y="292" class="mono">padded = [4, 2, 2]</text>
</svg>
