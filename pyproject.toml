[build-system]
requires = [
    "setuptools>=61.0",
    # CMake 3.25.0 breaks FindCUDAToolkit when nvptxcompiler_static is absent from CUDA wheels.
    "cmake>=3.21,!=3.25.0",
    "wheel",
    "pybind11[global]",
    "ninja",
    "nvidia-cudnn-frontend>=1.29.0",
]

# CUDA, framework, and optional feature requirements are defined in
# `build_tools/build_backend.py`. Isolated builds only build framework support
# selected with --config-settings framework=<framework> or NVTE_FRAMEWORK. Select CUDA with
# --config-settings cuda-version=<version>.
build-backend = "build_tools.build_backend"
backend-path = ["."]
